# Copy this block into ~/.codex/config.toml (or a trusted project .codex/config.toml).
# Keep TWILIO_AUTH_TOKEN / TWILIO_API_SECRET and TWILIO_CREDENTIALS_FILE in your shell environment; never commit them.

[mcp_servers.twilio]
command = "npx"
args = ["-y", "agent-phone-number-mcp@0.2.0"]
env_vars = ["TWILIO_ACCOUNT_SID", "TWILIO_AUTH_TOKEN", "TWILIO_API_KEY", "TWILIO_API_SECRET", "TWILIO_PHONE_NUMBER", "TWILIO_CREDENTIALS_FILE"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 20
tool_timeout_sec = 90

[mcp_servers.twilio.tools.twilio_send_call]
approval_mode = "approve"

[mcp_servers.twilio.tools.twilio_send_sms]
approval_mode = "approve"

[mcp_servers.twilio.tools.twilio_purchase_number]
approval_mode = "approve"

[mcp_servers.twilio.tools.twilio_configure_number]
approval_mode = "approve"

[mcp_servers.twilio.tools.twilio_api_request]
approval_mode = "approve"

# Optional: set to "auto" only for a read-only session with TWILIO_DRY_RUN=1.
# approval_policy = "on-request"
